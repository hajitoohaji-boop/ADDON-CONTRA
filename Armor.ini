;Just so you know the choices available, here is part of Damage.h
;{
; "EXPLOSION",            ;explosions
; "CRUSH",                ;hard-coded damage type used when a unit is being crushed + particle beam
; "ARMOR_PIERCING",       ;tank gun
; "SMALL_ARMS",           ;machinegun, strong penalty vs armor and buildings
; "GATTLING",             ;machinegun, penalty vs armor
; "COMANCHE_VULCAN",      ;machinegun, small penalty vs armor
; "RADIATION",            ;all radiation fields; they can not damage cleaning units, buildings and units with radiation defense
; "FLAME",                ;flames (dragon tank, inferno cannon, smerch, etc)
; "LASER",                ;point defense laser
; "SNIPER",               ;anti infantry weapons (snipers, flashbangs, microwave)
; "POISON",               ;all poisons; they can not damage cleaning units, buildings and toxin units
; "HEALING",              ;heals targeted units, used by emergency repair
; "UNRESISTABLE",         ;hard-coded damage type which always does 100% damage no matter what the armor set has this set to
; "WATER",                ;cryo beam and scripted water damage, 0% damage to aircraft and fuel
; "DEPLOY",               ;special damage type for recycling ability
; "SURRENDER",            ;neutron bomb special damage type: kills planes and neutralizes poisons
; "MICROWAVE",            ;acid damage type
; "HACK",                 ;cyber general data upload ability
; "KILL_PILOT",           ;jarmen kell kill pilot ability
; "PENALTY",              ;used to drain health from china power plant when overcharged and by Cloning special power
; "FALLING",              ;used to damage units when they fall from high altitude
; "MELEE",                ;special damage type for GLA sniper (used to distinguish units invulnerable to KILL_PILOT because Armor = KILL_PILOT 0% does not work for AI)
; "DISARM",               ;was dozer mine disarming ability, not used now
; "HAZARD_CLEANUP",       ;cleans up toxins, radiation and fuel
; "INFANTRY_MISSILE",     ;armor piercing, penalty vs dragon tank, irradiator, toxin tractor and microwave tank
; "AURORA_BOMB",          ;explosion with bonus vs all buildings
; "LAND_MINE",            ;used by land mines
; "JET_MISSILES",         ;armor piercing, penalty vs AA units
; "STEALTHJET_MISSILES",  ;bonus vs defenses, penalty vs AA units
; "MOLOTOV_COCKTAIL",     ;anti-radar missiles
; "SUBDUAL_MISSILE",      ;to jam missile
; "SUBDUAL_VEHICLE",      ;to turn off vehicle
; "SUBDUAL_BUILDING",     ;to turn off building
; "SUBDUAL_UNRESISTABLE", ;unresistable disabler, not used
; "KILL_GARRISONED",      ;kills garrisoned infantry
; "STATUS",               ;used to apply status effects such as avenger target designator, eye range bonus and jamming weapons
; "PARTICLE_BEAM",        ;mine detonator
; "TOPPLING"              ;armor piercing, 0% damage to infantry
;};

; "DEFAULT"               ;this sets the level for all nonspecified damage types


Armor NoArmor
  Armor = DEFAULT         100%
  Armor = HAZARD_CLEANUP    0% ;Not harmed by cleaning weapons
  Armor = SUBDUAL_MISSILE   0%
  Armor = SUBDUAL_VEHICLE   0%
  Armor = SUBDUAL_BUILDING  0%
  Armor = SURRENDER         0% ;special damage type for neutron bomb
  Armor = MOLOTOV_COCKTAIL  0%
  Armor = PARTICLE_BEAM     0% ;mine detonator
End

Armor PanicDecoyArmor
  Armor = DEFAULT        100%
End

Armor DemoTrapArmor
