    Name = LightningStormExplosionDistant
  End
  ParticleSystem
    Name = AntimatterFlare
    InitialDelay = 1600 1600 UNIFORM   ;In milliseconds
    Offset = X:0.0 Y:0.0 Z:0.0
  End
  ParticleSystem
    Name = AntimatterMissileExplosionFlash1
    Offset = X:0.0 Y:0.0 Z:10.0
    InitialDelay = 00 00 UNIFORM
  End
  ParticleSystem
    Name = AntimatterMissileExplosionFlash2
    Offset = X:0.0 Y:0.0 Z:10.0
    InitialDelay = 00 00 UNIFORM
  End
  ParticleSystem
    Name = AntimatterRing
    InitialDelay = 300 300 UNIFORM   ;In milliseconds
    Offset = X:0.0 Y:0.0 Z:10.0
  End
  ParticleSystem
     Name = AntimatterMushroomExplosion
     InitialDelay = 1900 1900 UNIFORM   ;In milliseconds
     Offset = X:0.0 Y:0.0 Z:0.0
  End
  ParticleSystem
    Name = AntimatterMushroomCloudRing
    InitialDelay = 1900 1900 UNIFORM   ;In milliseconds
    Offset = X:0.0 Y:0.0 Z:0.0
  End
  ParticleSystem
    Name = NukeHeat
    InitialDelay = 1000 1000 UNIFORM   ;In milliseconds
    Offset = X:0.0 Y:0.0 Z:10.0
  End
  ParticleSystem
    Name = AntimatterFlashGround1
    Offset = X:0.0 Y:0.0 Z:10.0
  End
  ParticleSystem
    Name = AntimatterFlashGround2
    Offset = X:0.0 Y:0.0 Z:30.0
  End
  ParticleSystem
    Name = AntimatterMushroomStem
    InitialDelay = 1900 1900 UNIFORM   ;In milliseconds
    Offset = X:0.0 Y:0.0 Z:0.0
  End
  ParticleSystem
    Name = AntimatterExplosionShockwaveHighLarge
    InitialDelay = 2800 2800 UNIFORM   ;In milliseconds
    Offset = X:0.0 Y:0.0 Z:0.0
  End
  ParticleSystem
    Name = AntimatterExplosionShockwaveAfter
    InitialDelay = 300 300 UNIFORM   ;In milliseconds
    Offset = X:0.0 Y:0.0 Z:0.0
  End
  ParticleSystem
    Name = AntimatterSparks
    InitialDelay = 300 300 UNIFORM   ;In milliseconds
    Offset = X:0.0 Y:0.0 Z:0.0
  End
  ParticleSystem
    Name = AntimatterShockwaveInverted
    InitialDelay = 1950 1950 UNIFORM   ;In milliseconds
    Offset = X:0.0 Y:0.0 Z:3.0
  End
  TerrainScorch
     Type = RANDOM
     Radius = 150
  End
