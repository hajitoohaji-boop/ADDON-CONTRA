    Type = STRONG
  End
  Sound
    Name = ExplosionCarpetBomb
  End
  Sound
    Name = ExplosionCarpetBombDelay200
  End
  Sound
    Name = ExplosionCarpetBombDelay400
  End
  Sound
    Name = ExplosionCarpetBombDelay600
  End
