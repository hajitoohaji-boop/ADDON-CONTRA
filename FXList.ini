; weapon fx for firing the gun (but not the shells landing)
FXList WeaponFX_BattleshipBogusGun
; This is where the battleship shake needs to be set
  ViewShake
    Type = SEVERE
  End
  ParticleSystem
    Name = BattleshipMuzzleFlashFlame
    OrientToObject = Yes
  End
  ParticleSystem
    Name = BattleshipMuzzleFlashSmoke
    OrientToObject = Yes
  End
  ParticleSystem
    Name = BattleshipMuzzleFlashWave
    Offset = X:0.0 Y:0.0 Z:-20.0
    OrientToObject = Yes
  End
End

; ----------------------------------------------
; weapon fx for a "shell" "landing" on the target
FXList WeaponFX_BattleshipTargetExplode
  ViewShake
    Type = SUBTLE
  End
  ParticleSystem
    Name = StrategyCenterBarrageDebris
  End
  ParticleSystem
    Name = SpectreHowitzerExplosionCloud
  End
  ParticleSystem
    Name = BuggyNewExplosionShockwave
    Offset = X:0 Y:0 Z:2
  End
  ParticleSystem
    Name = StratCentBarrageLenzflare
    Height = 10 10 CONSTANT
  End
  ParticleSystem
    Name = MAGMA_ShellDetonationExplosionLightSmall
  End
  ParticleSystem
    Name = MAGMA_ShellDetonationExplosionSparks
    Offset = X:0.0 Y:0.0 Z:2.0
  End
  ParticleSystem
    Name = artDebris
  End
  ParticleSystem
    Name = ArtillerySmokeCloud
  End
  ParticleSystem
    Name = MAGMA_ShellDetonationExplosionShockwaveSmall
    InitialDelay = 0 0 UNIFORM   ;In milliseconds
    Offset = X:0.0 Y:0.0 Z:0.0
  End
  ParticleSystem
    Name = ArtFlash1s
    Offset = X:0.0 Y:0.0 Z:10.0
  End
  ParticleSystem
    Name = ArtFlash2s
    Offset = X:0.0 Y:0.0 Z:10.0
  End
  Sound
    Name = ExplosionBattleshipTarget
  End
End

