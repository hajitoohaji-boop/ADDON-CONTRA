ObjectCreationList SUPERWEAPON_MSABossTankParadrop
  DeliverPayload
    Transport = SkirmishMapJetCargoPlane
    StartAtPreferredHeight = Yes
    StartAtMaxSpeed = Yes
    MaxAttempts = 4
    DropOffset = X:0 Y:0 Z:-10
    DropDelay = 400         ; time in between each item dropped (if more than one)
    ParachuteDirectly = No ; will tell all contained parachutes to go ahead and bunch
    PutInContainer = LargeParachute
    Payload = Boss_AmericaTankMammoth_Unmanned 3
;    Payload =
;    Payload =
    DeliveryDistance = 200 ;when outbound vehicle must be this close to target to continue delivery
    PreOpenDistance = 40  ;When inbound, vehicle can be this much farther than DeliveryDistance to begin delivery
    DeliveryDecalRadius = 140
    DeliveryDecal
      Texture           = exsonar
      Style             = SHADOW_ADDITIVE_DECAL
      OpacityMin        = 25%
      OpacityMax        = 50%
      OpacityThrobTime  = 500
      Color             = R:0 G:0 B:255 A:255
      OnlyVisibleToOwningPlayer = No
    End
  End
End

