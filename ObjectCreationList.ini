ObjectCreationList SUPERWEAPON_MARPTomahawkStrike
  Attack
    WeaponSlot = TERTIARY
    NumberOfShots = 6
    DeliveryDecalRadius = 100 ; align with SpecialPower.ini's RadiusCursorRadius
    DeliveryDecal
      Texture           = SCCNapalmStrike_China
      Style             = SHADOW_ALPHA_DECAL
      OpacityMin        = 25%
      OpacityMax        = 50%
      OpacityThrobTime  = 500
      Color             = R:255 G:156 B:0 A:255
      OnlyVisibleToOwningPlayer = Yes
    End
  End
End

