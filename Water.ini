  Vertex10Color = R:150 G:150 B:150
  Vertex01Color = R:150 G:150 B:150
  Vertex11Color = R:150 G:150 B:150
  DiffuseColor   = R:225 G:225 B:225 A:255
  TransparentDiffuseColor = R:150 G:150 B:150 A:96
